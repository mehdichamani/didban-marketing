<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="didban-sm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow-didban-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Dark Container -->
  <rect width="64" height="64" rx="16" fill="#061c14"/>
  
  <!-- Circular Badge & Iris Node (Exact match to Boomban Node) -->
  <g filter="url(#glow-didban-sm)">
    <!-- Outer Node Ring -->
    <circle cx="32" cy="32" r="22" fill="#061c14" stroke="#059669" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="18" fill="url(#didban-sm-grad)"/>
    
    <!-- Camera Lens Iris / Aperture -->
    <circle cx="32" cy="32" r="8" fill="#042f22" stroke="#ffffff" stroke-width="2.2"/>
    <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
    
    <!-- Blinking / Recording Status Dot -->
    <circle cx="23.5" cy="23.5" r="2.5" fill="#ef4444"/>
  </g>
</svg>
